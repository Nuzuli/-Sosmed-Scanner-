name: Update lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and freeze dev dependencies
        run: |
          python -m venv .lockenv
          . .lockenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip freeze > requirements-dev.lock

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-dev.lock
          git diff --cached --quiet || git commit -m "Update requirements-dev.lock"
          git push
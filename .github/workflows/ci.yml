name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Check lockfile is in sync
        run: |
          while IFS= read -r line; do
            case "$line" in ""|"#"*|"-r "*) continue ;; esac
            grep -qixF "$line" requirements-dev.lock || {
              echo "requirements-dev.lock is missing or out of date: $line"
              echo "Run the 'Update lockfile' workflow to regenerate it."
              exit 1
            }
          done < requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --no-deps -r requirements-dev.lock

      - name: Lint with ruff
        run: ruff check sosmed_scanner tests

      - name: Type check with mypy
        run: mypy sosmed_scanner

      - name: Run tests with coverage
        run: pytest --cov=sosmed_scanner --cov-report=term-missing --cov-fail-under=80
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sosmed-scanner"
version = "0.4.0"
description = "Check whether a username exists on public profile pages - 20 platforms, zero dependencies (Python standard library only)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Nuzuli" },
]
keywords = ["username-checker", "osint", "cli", "social-media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]

[project.urls]
Homepage = "https://github.com/Nuzuli/sosmed-scanner"
Repository = "https://github.com/Nuzuli/sosmed-scanner"

[project.scripts]
sosmed-scanner = "sosmed_scanner.cli:main"

[tool.setuptools]
packages = ["sosmed_scanner"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["W292"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
